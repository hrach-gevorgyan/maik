org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Build speed. The configuration cache is the big one: it skips re-running the
# build scripts entirely when nothing about the build itself changed.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true

kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableResourceOptimizations=true
kotlin.code.style=official
