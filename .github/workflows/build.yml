name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify every offered model is actually loadable
        run: python tools/verify_models.py

      # Lint fails the build on errors — it caught a format string that would have
      # crashed the chat while a download was running. The instrumentation tests are
      # compiled here too, without an emulator: they broke once and nothing noticed
      # until a release was already failing.
      - name: Test, lint and assemble
        run: ./gradlew test lintDebug lintRelease assembleDebug assembleRelease assembleDebugAndroidTest --no-daemon

      - name: Publish lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: maik-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
