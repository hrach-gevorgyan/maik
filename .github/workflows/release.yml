name: Release

# Tag a commit to cut a release:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.0.1)"
        required: true

permissions:
  contents: read

jobs:
  # A bad tag fails in seconds, not after the 45-minute emulator gate.
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - name: Work out the version
        id: version
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$VERSION_INPUT"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Bad version '$VERSION'; expected MAJOR.MINOR.PATCH"
            exit 1
          fi
          # Turn 1.2.3 into a monotonic integer: 1*10000 + 2*100 + 3
          CODE=$((10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]}))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (versionCode $CODE)"

  # Nothing gets published until a real emulator has downloaded a real model,
  # loaded it, and made it answer. The same workflow runs on pull requests.
  golden:
    needs: version
    uses: ./.github/workflows/golden.yml

  release:
    needs: [version, golden]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/maik.jks"
            echo "path=$RUNNER_TEMP/maik.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret — falling back to a debug-signed build."
          fi

      # Always the shrunk, non-debuggable release variant. Without the real keystore
      # Gradle signs it with the runner's throwaway debug key, so it still installs.
      - name: Build the APK
        env:
          MAIK_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          MAIK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MAIK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MAIK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew test lintRelease assembleRelease \
            -PmaikVersionName=${{ needs.version.outputs.name }} \
            -PmaikVersionCode=${{ needs.version.outputs.code }} \
            -PmaikShipping=true \
            --no-daemon

      - name: Name the artifact, and refuse to ship it unsigned
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -1)

          if [ -z "$SRC" ]; then
            echo "::error::No installable APK was produced."
            exit 1
          fi

          # Verify with apksigner, not by looking for META-INF/*.RSA: that is v1
          # JAR signing, which AGP omits entirely when minSdk >= 24. A v2/v3-only
          # APK is perfectly installable and has nothing in META-INF.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found; cannot confirm the APK is installable."
            exit 1
          fi
          if ! "$APKSIGNER" verify --print-certs "$SRC"; then
            echo "::error::$SRC is unsigned and no phone would install it. Refusing to publish."
            exit 1
          fi

          DEST="maik-${{ needs.version.outputs.name }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Pull this version's notes out of the changelog
        id: notes
        run: |
          VERSION="${{ needs.version.outputs.name }}"
          # Everything between this version's heading and the next one.
          awk -v v="## $VERSION" '
            index($0, v " ") == 1 || $0 == v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "::error::No CHANGELOG entry for $VERSION. Write one before tagging."
            exit 1
          fi

          if [ "${{ steps.keystore.outputs.signed }}" != "true" ]; then
            {
              printf '\n---\n\n'
              printf '> **Debug-signed build.** It installs and runs normally, but every\n'
              printf '> release is signed with a different throwaway key, so uninstall the\n'
              printf '> previous version before installing this one.\n>\n'
              printf '> Add the keystore secrets described in the README for proper signed\n'
              printf '> releases that install as upgrades.\n'
            } >> notes.md
          fi

      # Published with the CLI that ships on the runner rather than a third-party
      # action: 3.0.0 failed twice inside that action, once on a GitHub 500 and once
      # on a failed asset upload, with a 45-minute emulator gate behind each attempt.
      # Uploading 24 MB is the part that flakes, so it is retried on its own.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', needs.version.outputs.name) || github.ref_name }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail

          # A re-run after a half-finished publish must not fail on "already exists" —
          # and what it finds is usually a draft the failed attempt left behind, which
          # nobody but the repository owner can see. Publishing it is the point.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "maik ${{ needs.version.outputs.name }}" \
              --notes-file notes.md \
              --draft=false
          else
            gh release create "$TAG" \
              --title "maik ${{ needs.version.outputs.name }}" \
              --notes-file notes.md \
              --target "${{ github.sha }}"
          fi

          for attempt in 1 2 3; do
            if gh release upload "$TAG" "$APK" --clobber; then
              echo "asset uploaded on attempt $attempt"
              exit 0
            fi
            echo "upload attempt $attempt failed; retrying"
            sleep $((attempt * 20))
          done

          echo "::error::The APK could not be uploaded after three attempts."
          exit 1

      # A release with no APK is worse than no release: the tag looks shipped and
      # nothing can be installed from it.
      - name: Check the release really carries the APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', needs.version.outputs.name) || github.ref_name }}
        run: |
          set -euo pipefail
          count=$(gh release view "$TAG" --json assets --jq '[.assets[] | select(.name | endswith(".apk"))] | length')
          if [ "$count" -lt 1 ]; then
            echo "::error::$TAG was published without an APK."
            exit 1
          fi
          # A draft is invisible to everyone but the owner, so a "successful" release
          # nobody can download would otherwise pass this job.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "::error::$TAG is still a draft."
            exit 1
          fi
