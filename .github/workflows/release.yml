name: Release

# Tag a commit to cut a release:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  # Nothing gets published until a real emulator has downloaded a real model,
  # loaded it, and made it answer. Three releases shipped without this.
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify every offered model is actually loadable
        run: python tools/verify_models.py

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prove the app works on a device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew connectedDebugAndroidTest --no-daemon

  release:
    needs: golden
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # Turn 1.2.3 into a monotonic integer: 1*10000 + 2*100 + 3
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (versionCode $CODE)"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/maik.jks"
            echo "path=$RUNNER_TEMP/maik.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret — falling back to a debug-signed build."
          fi

      # An unsigned APK cannot be installed on any Android device, so without a
      # keystore we ship the debug variant instead: at least it carries a
      # signature, using the throwaway key Gradle generates on the runner.
      - name: Build the APK
        env:
          MAIK_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          MAIK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MAIK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MAIK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            TASK=assembleRelease
          else
            TASK=assembleDebug
          fi
          ./gradlew test $TASK \
            -PmaikVersionName=${{ steps.version.outputs.name }} \
            -PmaikVersionCode=${{ steps.version.outputs.code }} \
            -PmaikShipping=true \
            --no-daemon

      - name: Name the artifact, and refuse to ship it unsigned
        id: apk
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            SRC=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -1)
          else
            SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          fi

          if [ -z "$SRC" ]; then
            echo "::error::No installable APK was produced."
            exit 1
          fi

          # Verify with apksigner, not by looking for META-INF/*.RSA: that is v1
          # JAR signing, which AGP omits entirely when minSdk >= 24. A v2/v3-only
          # APK is perfectly installable and has nothing in META-INF.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found; cannot confirm the APK is installable."
            exit 1
          fi
          if ! "$APKSIGNER" verify --print-certs "$SRC"; then
            echo "::error::$SRC is unsigned and no phone would install it. Refusing to publish."
            exit 1
          fi

          DEST="maik-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Pull this version's notes out of the changelog
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          # Everything between this version's heading and the next one.
          awk -v v="## $VERSION" '
            $0 ~ "^" v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "No changelog entry for $VERSION yet." > notes.md
          fi

          if [ "${{ steps.keystore.outputs.signed }}" != "true" ]; then
            {
              printf '\n---\n\n'
              printf '> **Debug-signed build.** It installs and runs normally, but every\n'
              printf '> release is signed with a different throwaway key, so uninstall the\n'
              printf '> previous version before installing this one.\n>\n'
              printf '> Add the keystore secrets described in the README for proper signed\n'
              printf '> releases that install as upgrades.\n'
            } >> notes.md
          fi

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.name) || github.ref_name }}
          name: maik ${{ steps.version.outputs.name }}
          body_path: notes.md
          files: ${{ steps.apk.outputs.path }}
