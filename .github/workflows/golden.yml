name: Golden

# The one check unit tests cannot make: boot a real Android image, download a real
# model, load it with the real runtime, and make it answer. Every broken release so
# far failed exactly where a model file meets the runtime.
#
# It runs on pull requests, by hand, and as the gate in release.yml — not on every
# push, because an emulator run takes the better part of half an hour.
on:
  pull_request:
    branches: [main]
    # Half an hour of emulator and a model download buys nothing for a docs change.
    paths-ignore: ["**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Compile before the emulator boots, so its time limit is spent on the test.
      - name: Build the app and the test
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      # The emulator needs hardware acceleration to be usable at all.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The test uses LFM2.5 (0.7 GB). The emulator gets room for it to download and
      # load without the run failing on the emulator's limits instead of the app.
      - name: Run the golden test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 6144M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
