name: Golden

# The check that would have caught 1.1.0, 1.2.0 and 1.3.0: boot a real Android
# image, download a real model, load it, and make it produce a sentence. Unit tests
# cannot see this class of failure, because it only exists where the bundle format
# meets the runtime.
# Deliberately NOT on push to main: release.yml runs this same gate on the tag,
# and paying for two 25-minute emulator runs per change is just waste.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The emulator needs hardware acceleration to be usable at all.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache the downloaded model
        uses: actions/cache@v4
        with:
          path: ~/.maik-model-cache
          key: golden-model-smollm-135m-v1

      - name: Run the golden test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
